plugins {
    id 'com.android.application'
}
dependencies {
    implementation 'androidx.games:games-frame-pacing:2.1.3'
}

// The native libraries (libmain.so, libSDL3.so, libadrenotools' hooks, the Turnip driver) are built by CMake beforehand
// (tools/android/build_native.sh) into app/libs/arm64-v8a, and the shaders and fonts into app/assets; Gradle only packages.
android {
    namespace = "com.ptport.app"
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId project.findProperty("ptApplicationId") ?: "com.ptport.app.test"
        manifestPlaceholders = [ptAppLabel: project.findProperty("ptAppLabel") ?: "pt4droid"]
        minSdkVersion 29
        targetSdkVersion 35
        versionCode((project.findProperty('ptVersionCode') ?: '1') as int)
        versionName project.findProperty('ptVersionName') ?: 'dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PT_KEYSTORE') ?: 'missing-release-key.jks')
            storePassword System.getenv('PT_STORE_PASSWORD')
            keyAlias System.getenv('PT_KEY_ALIAS') ?: 'pt-test'
            keyPassword System.getenv('PT_KEY_PASSWORD') ?: System.getenv('PT_STORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['libs']
        assets.srcDirs = ['assets']
    }
    packagingOptions {
        jniLibs {
            // libadrenotools loads its hooks and the driver from nativeLibraryDir, so the libraries must be unpacked on install
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}
